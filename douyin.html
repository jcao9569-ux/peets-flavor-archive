</style></head><body><main class="layout"><section class="intro"><div class="brand">Peet’s Coffee</div><div class="eyebrow">THE FLAVOR ARCHIVE</div><h1>每一杯咖啡，<br>都有自己的风味身份。</h1><p>从熟悉的那一杯出发，发现你的风味偏爱。点击广告中的测试按钮，开启个人风味档案。</p><a href="https://jcao9569-ux.github.io/peets-flavor-archive/index.html?v=2">开启我的风味档案</a></section><section class="ad-frame" aria-label="抖音信息流广告样式演示"><img src="assets/douyin-ad.png" alt="Peet’s Coffee风味档案室抖音竖屏广告，一杯咖啡正在等待身份确认"><a class="hotspot cta" href="https://jcao9569-ux.github.io/peets-flavor-archive/index.html?v=2" aria-label="测测你的咖啡风味身份，进入风味档案H5"></a><button class="hotspot like" aria-label="点赞" aria-pressed="false">♥</button><button class="hotspot share" aria-label="分享此广告"></button></section></main><footer class="notice">广告创意演示，非品牌官方投放。界面互动数字为示意。<br>测试按钮可进入风味档案 H5。</footer><div class="toast" role="status" aria-live="polite"></div><script>
var timer;function toast(t){var n=document.querySelector('.toast');n.textContent=t;n.classList.add('show');clearTimeout(timer);timer=setTimeout(function(){n.classList.remove('show')},2200)}document.querySelector('.like').onclick=function(){var liked=this.classList.toggle('active');this.setAttribute('aria-pressed',String(liked));toast(liked?'已点赞':'已取消点赞')};document.querySelector('.share').onclick=async function(){var u=location.href;try{if(navigator.share){await navigator.share({title:'Peet’s Coffee · 风味档案室',url:u})}else if(navigator.clipboard){await navigator.clipboard.writeText(u);toast('链接已复制，可以分享给朋友')}else{toast('请复制浏览器地址分享')}}catch(e){if(e.name!=='AbortError')toast('请使用浏览器的分享功能')}};
